<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demostración VPS Fetch/Write</title>
  <style>
    body{font-family:system-ui,Arial;padding:2rem;max-width:760px;margin:auto;line-height:1.5}
    .card{padding:1rem;border:1px solid #ddd;border-radius:12px;margin:1rem 0}
    .row{margin:.75rem 0}
    button{padding:.6rem 1rem;cursor:pointer}
    .ok{color:green}.err{color:#b00020}
    pre{background:#fafafa;border:1px solid #eee;padding:1rem;border-radius:8px;overflow:auto}
  </style>
  <script defer src="https://analytics.a7automationstudio.cloud/script.js" data-website-id="aedf2a65-3e46-4cf2-ae9f-87ab02062a3d"></script>
</head>
<body>
  <h1>Demostración VPS Fetch/Write</h1>
  <p>Esta página es servida por Node.js en tu VPS. Usa los botones para llamar a las rutas reales de la API.</p>
  <div class="card">
    <h3>Lectura: Obtener Datos (GET)</h3>
    <div class="row">
      <button id="getBtn">Obtener Datos</button>
      <span id="getMsg"></span>
    </div>
  </div>
  <div class="card">
    <h3>Escritura: Guardar un Evento (POST)</h3>
    <div class="row">
      <button id="writeBtn">Escribir Datos</button>
      <span id="writeMsg"></span>
    </div>
  </div>
  <div class="card">
    <h3>Métricas (En Vivo)</h3>
    <pre id="metricsBox">Cargando…</pre>
  </div>
<script>
const $ = (id)=>document.getElementById(id);
async function getJSON(url, opts){ const r=await fetch(url,opts); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
$('getBtn').onclick = async () => {
  try {
    const data = await getJSON('/api/time');
    $('getMsg').textContent = 'Hora del servidor: ' + data.time;
    $('getMsg').className = 'ok';
    window.umami?.track('fetch_data');
  } catch {
    $('getMsg').textContent = 'Error';
    $('getMsg').className = 'err';
  }
};
$('writeBtn').onclick = async () => {
  try {
    const data = await getJSON('/api/demo-write', { method:'POST' });
    $('writeMsg').textContent = 'Escrituras hasta ahora: ' + data.total;
    $('writeMsg').className = 'ok';
    window.umami?.track('write_data');
    loadMetrics();
  } catch {
    $('writeMsg').textContent = 'Error';
    $('writeMsg').className = 'err';
  }
};
async function loadMetrics(){
  try {
    const m = await getJSON('/api/metrics');
    $('metricsBox').textContent = JSON.stringify(m, null, 2);
  } catch {
    $('metricsBox').textContent = 'Error al cargar métricas';
  }
}
loadMetrics();
</script>
</body>
</html>
